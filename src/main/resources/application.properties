spring.application.name=hackathon-setic-2026
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackathon_setic_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.security.jwt.private-key=${JWT_PRIVATE_KEY:src/main/resources/keys/private_key.pem}
app.security.jwt.public-key=${JWT_PUBLIC_KEY:src/main/resources/keys/public_key.pem}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
